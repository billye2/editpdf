<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EditPDF</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="brand">EditPDF</span>
      <button id="btn-open" title="Open a PDF file">Open</button>
      <button id="btn-save" title="Save (overwrite the opened file)" disabled>Save</button>
      <button id="btn-download" title="Download a copy" disabled>Download</button>
      <button id="btn-undo" title="Undo last edit" disabled>Undo</button>
      <span class="sep"></span>
      <button id="btn-zoom-out" title="Zoom out" disabled>−</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="Zoom in" disabled>+</button>
      <span class="sep"></span>
      <label id="debug-wrap"><input type="checkbox" id="chk-debug" /> Debug boxes</label>
      <span id="file-name"></span>
    </header>
    <div id="banner" hidden></div>
    <main id="pages">
      <div id="dropzone">
        <div>
          <h1>EditPDF</h1>
          <p>Drop a PDF here, or click <strong>Open</strong>.</p>
          <p class="hint">
            Click a paragraph to edit its text — the paragraph reflows to fit.
            On scanned PDFs with an OCR text layer, click a highlighted word to patch it.
          </p>
        </div>
      </div>
    </main>
    <div id="toast" hidden></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
